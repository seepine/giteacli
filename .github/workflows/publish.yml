# 使用 npm Trusted Publishing（OIDC），不再需要 NPM_TOKEN
#   1. npm 包设置页 → Trusted Publisher → GitHub Actions
#      Owner: seepine / Repository: giteacli / Workflow filename: publish.yml
#      （若配置了 Environment，名称需与下面的 environment 一致）
#   2. 需要 npm >= 11.5.1（Node 24 自带版本已满足）

name: Publish

on:
  push:
    tags:
      - v*

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # 换取 OIDC 令牌，用于 Trusted Publishing 与自动 provenance
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org' # OIDC 流程需要
          package-manager-cache: false # 发布构建禁用缓存

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          cache: true

      - name: Install
        run: pnpm install

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: npm publish
